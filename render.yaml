services:
  - type: web
    name: showrunner
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: memory
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_RUNS_PER_OWNER_PER_HOUR
        value: "10"
      - key: MAX_RUNS_PER_IP_PER_HOUR
        value: "30"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_BASE_URL
        value: https://api.example.test/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: example-model
      - key: LLM_TIMEOUT
        value: "30"
      - key: LLM_MAX_TOKENS
        value: "800"
      - key: LLM_DAILY_CAP
        value: "50"
